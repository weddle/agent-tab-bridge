<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        width: 320px;
        margin: 0;
        padding: 14px;
        background: #1c1c1e;
        color: #f2f2f7;
        font-family: system-ui, sans-serif;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 10px;
        font-size: 15px;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #6b7280;
      }
      .dot.on { background: #34c759; }
      .dot.connecting { background: #f59e0b; }
      .dot.error { background: #ff3b30; }
      p {
        margin: 6px 0;
        color: #98989f;
        font-size: 12px;
        line-height: 1.4;
      }
      textarea {
        box-sizing: border-box;
        width: 100%;
        min-height: 52px;
        resize: vertical;
        border: 1px solid #3a3a3c;
        border-radius: 6px;
        background: #2c2c2e;
        color: #f2f2f7;
        font-family: ui-monospace, monospace;
        font-size: 11px;
      }
      button {
        width: 100%;
        margin-top: 8px;
        padding: 7px 10px;
        border: 0;
        border-radius: 6px;
        background: #2463eb;
        color: white;
        cursor: pointer;
        font-size: 13px;
      }
      button.secondary {
        background: #3a3a3c;
        color: #f2f2f7;
      }
      button:disabled {
        cursor: default;
        opacity: 0.5;
      }
      .hidden { display: none; }
      #error { color: #ff453a; }
    </style>
  </head>
  <body>
    <h1><span id="statusDot" class="dot"></span>Agent Tab Bridge</h1>
    <div id="pairSection">
      <p>Paste the one-time pairing string from the local Agent Tab Bridge relay.</p>
      <textarea id="pairingString" placeholder="ws://127.0.0.1:12345/extension#…"></textarea>
      <p id="error" class="hidden"></p>
      <button id="pairButton">Pair</button>
    </div>
    <div id="connectedSection" class="hidden">
      <p id="statusLine"></p>
      <button id="shareButton" disabled>Share this tab</button>
      <button id="unpairButton" class="secondary">Unpair</button>
    </div>
    <script src="popup.js" type="module"></script>
  </body>
</html>
